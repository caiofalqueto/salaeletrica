<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Entrar — Sala Elétrica</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#00795A">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/estilo.css">
<style>
  body{display:flex;flex-direction:column;min-height:100vh}

  .centro{
    flex:1;
    display:flex;align-items:center;justify-content:center;
    padding:48px var(--respiro);
  }

  .cartao-acesso{
    width:100%;max-width:440px;
    background:var(--branco);
    border:1px solid var(--linha);
    padding:40px 34px;
  }

  .cartao-acesso .marca{justify-content:center;margin-bottom:26px}

  .cartao-acesso h1{
    margin:0 0 8px;
    font-size:26px;font-weight:700;letter-spacing:-.03em;
    text-align:center;
  }
  .cartao-acesso .subtitulo{
    margin:0 0 30px;
    font-size:15px;color:var(--grafite-2);
    text-align:center;text-wrap:pretty;
  }

  /* Botao do Google, seguindo a marca deles em fundo claro */
  .botao-google{
    display:flex;align-items:center;justify-content:center;gap:12px;
    width:100%;padding:14px 20px;
    background:var(--branco);
    border:1px solid var(--borda-campo);
    color:var(--tinta);
    font-family:var(--texto);font-size:15.5px;font-weight:600;
    cursor:pointer;
    transition:border-color .14s ease,box-shadow .14s ease;
  }
  .botao-google:hover{border-color:var(--cinza);box-shadow:0 2px 8px rgba(0,0,0,.07)}
  .botao-google:disabled{opacity:.55;cursor:wait;box-shadow:none}
  .botao-google svg{flex:none}

  .nota{
    margin:24px 0 0;
    font-size:12.5px;line-height:1.6;
    color:var(--grafite-2);text-align:center;
  }
  .nota a{border-bottom:1px solid var(--verde-linha)}

  .erro{
    margin:22px 0 0;
    padding:12px 14px;
    background:#FDF1F0;
    border:1px solid #E7B9B5;
    color:#9B322B;
    font-size:13.5px;
    display:none;
  }

  .voltar{
    margin:28px 0 0;padding-top:20px;
    border-top:1px solid var(--linha-clara);
    text-align:center;
    font-family:var(--mono);font-size:11.5px;
  }
  .voltar a{color:var(--cinza);border:none}
  .voltar a:hover{color:var(--verde)}

  @media (max-width:520px){
    .cartao-acesso{padding:32px 22px;border-left:none;border-right:none}
  }
</style>
</head>
<body>

<header class="topo">
  <a class="marca" href="/">
    <svg width="42" height="42" viewBox="0 0 100 100" role="img" aria-label="Sala Elétrica">
      <path d="M22 0 H78 A22 22 0 0 1 100 22 V78 A22 22 0 0 1 78 100 H22 A22 22 0 0 1 0 78 V22 A22 22 0 0 1 22 0 Z M64 12 L30 54 H46 L36 88 L70 44 H52 Z" fill="#00A37A" fill-rule="evenodd"/>
    </svg>
    <span class="marca-texto">
      <span>Sala</span>
      <span class="marca-linha2"><span>Elétrica</span><span class="marca-cursor"></span></span>
    </span>
  </a>
  <nav class="menu">
    <a href="/#calculadoras">Calculadoras</a>
    <a href="/#downloads">Downloads</a>
    <a href="/sobre">Sobre</a>
  </nav>
</header>

<div class="centro">
  <main class="cartao-acesso">

    <div class="marca">
      <svg width="46" height="46" viewBox="0 0 100 100" aria-hidden="true">
        <path d="M22 0 H78 A22 22 0 0 1 100 22 V78 A22 22 0 0 1 78 100 H22 A22 22 0 0 1 0 78 V22 A22 22 0 0 1 22 0 Z M64 12 L30 54 H46 L36 88 L70 44 H52 Z" fill="#00A37A" fill-rule="evenodd"/>
      </svg>
    </div>

    <h1>Área de membros</h1>
    <p class="subtitulo">Entre para acessar as ferramentas de projeto.</p>

    <button class="botao-google" id="btnGoogle">
      <svg width="19" height="19" viewBox="0 0 48 48" aria-hidden="true">
        <path fill="#4285F4" d="M45.1 24.5c0-1.6-.1-2.8-.4-4.1H24v7.4h12.1c-.2 2-1.6 5-4.5 7l-.1.3 6.5 5 .5.1c4.1-3.8 6.6-9.4 6.6-15.7z"/>
        <path fill="#34A853" d="M24 46c5.9 0 10.9-1.9 14.5-5.3l-6.9-5.3c-1.8 1.3-4.3 2.2-7.6 2.2-5.8 0-10.7-3.8-12.5-9.9l-.3.1-6.8 5.2-.1.3C7.9 41 15.3 46 24 46z"/>
        <path fill="#FBBC05" d="M11.5 27.7c-.5-1.4-.7-2.9-.7-4.4s.3-3 .7-4.4v-.3l-6.9-5.3-.2.1C2.9 16.3 2 20 2 23.9s.9 7.6 2.4 10.9l7.1-5.5z"/>
        <path fill="#EB4335" d="M24 9.5c4.1 0 6.9 1.8 8.5 3.3l6.2-6C34.9 3.4 29.9 1 24 1 15.3 1 7.9 6 4.4 13.3l7.1 5.5C13.3 13.3 18.2 9.5 24 9.5z"/>
      </svg>
      Entrar com o Google
    </button>

    <div class="erro" id="erro" role="alert"></div>

    <p class="nota">
      Ao entrar, você concorda com os
      <a href="/termos">termos de uso</a> e a
      <a href="/privacidade">política de privacidade</a>.
    </p>

    <p class="voltar"><a href="/">voltar ao site</a></p>

  </main>
</div>

<script type="module">
  import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';

  const SUPABASE_URL = 'https://kahbgjwwqsejocmseegc.supabase.co';
  const SUPABASE_KEY = 'sb_publishable_g2opUBjSqj6hXZ2HDsAMhQ_jfMVARqX';

  const supabase = createClient(SUPABASE_URL, SUPABASE_KEY);

  // Destino fixo: nao depende de o usuario ter chegado pelo www ou pelo apex
  const DESTINO = 'https://salaeletrica.com.br/app';

  const btn = document.getElementById('btnGoogle');
  const erro = document.getElementById('erro');

  // Se ja estiver logado, vai direto para a area de ferramentas
  const { data: { session } } = await supabase.auth.getSession();
  if (session) window.location.replace('/app');

  btn.addEventListener('click', async () => {
    btn.disabled = true;
    erro.style.display = 'none';

    const { error } = await supabase.auth.signInWithOAuth({
      provider: 'google',
      options: { redirectTo: DESTINO }
    });

    if (error) {
      erro.textContent = 'Não foi possível iniciar o login: ' + error.message;
      erro.style.display = 'block';
      btn.disabled = false;
    }
  });
</script>

</body>
</html>
